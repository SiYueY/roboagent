[project]
name = "RoboAgent"
version = "1.2.0"
description = "The Brain of an Autonomous Robot System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
    "openai>=2.31.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
gradio = [
    "gradio>=6,<7",
]
speech = [
    "dashscope>=1.25.6",
    "av<17.1.0", # pyrnnoise 0.4.x is not compatible with PyAV 17.1+
    "audiolab==0.5.1", # compatible Graph API used by pyrnnoise 0.4.x
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pyrnnoise>=0.4",
    "soxr>=0.5",
    "uvicorn[standard]>=0.30",
]
speech-webrtc = [
    "pywebrtc-audio>=0.1.0",
]
speech-alsa = [
    "pyalsaaudio>=0.11.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "ruff>=0.11",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
files = [
    "roboagent/message.py",
    "roboagent/context/manager.py",
    "roboagent/context/budget.py",
    "roboagent/tool/tool.py",
    "roboagent/tool/workspace.py",
    "roboagent/tool/materializer.py",
    "roboagent/tool/approval.py",
    "roboagent/tool/executor.py",
    "roboagent/agent/persistence.py",
    "roboagent/agent/session.py",
    "roboagent/agent/loop.py",
    "roboagent/agent/run.py",
    "roboagent/mcp.py",
    "roboagent/runtime",
]
