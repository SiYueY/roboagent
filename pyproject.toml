[project]
name = "RoboAgent"
version = "0.1.0"
description = "The Brain of an Autonomous Robot System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.31.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
gradio = [
    "gradio>=6,<7",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
