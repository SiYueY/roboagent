[project]
name = "RoboAgent"
version = "0.1.0"
description = "The Brain of an Autonomous Robot System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.31.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
gradio = [
    "gradio>=6,<7",
]
speech = [
    "dashscope>=1.25.6",
    "av<17.1.0", # pyrnnoise 0.4.x is not compatible with PyAV 17.1+
    "audiolab==0.5.1", # compatible Graph API used by pyrnnoise 0.4.x
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pyrnnoise>=0.4",
    "soxr>=0.5",
    "uvicorn[standard]>=0.30",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
