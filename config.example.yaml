# Copy this file to config.yaml. API keys are resolved from sibling .env files.
default_model: qwen3-7-flash
models:
  - name: qwen3-7-flash
    display_name: Qwen3.7-Flash
    provider: tongyi
    params:
      model: qwen3.7-flash
      dashscope_api_key: ${DASHSCOPE_API_KEY}
skills: {sources: []}
speech:
  # pipeline is the stable ASR -> Agent -> TTS path. realtime currently
  # falls back to this path when the account/runtime cannot provide it.
  mode: pipeline
  asr:
    provider: dashscope
    model: qwen-audio-3.0-asr-flash-streaming
    dashscope_api_key: ${DASHSCOPE_API_KEY}
    language_hints: [zh]
    silence_ms: 800
    speech_noise_threshold: 0.2
    heartbeat: true
  tts:
    provider: dashscope
    model: qwen3-tts-flash-realtime
    voice: Cherry
    dashscope_api_key: ${DASHSCOPE_API_KEY}
    volume: 100
    # Start speech early, then prefer natural sentence boundaries.
    first_chunk_chars: 16
    chunk_chars: 48
  audio:
    processor: rnnoise
    required: false
    resampler_quality: QQ
  vad:
    provider: silero
    confidence: 0.5
    min_volume: 0.003
    start_ms: 160
    stop_ms: 280
  turn:
    silence_ms: 400
    max_duration_ms: 20000
    idle_timeout_ms: 1000
    min_speech_ms: 300
    interruption:
      enabled: true
      min_duration_ms: 300
      min_confidence: 0.55
      min_volume: 0.003
  diagnostics: true
